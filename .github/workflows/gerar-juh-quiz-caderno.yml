name: Gerar Juh Quiz - Caderno

on:
  workflow_dispatch:
    inputs:
      layout:
        description: "Escolha a cor da folha"
        required: true
        type: choice
        default: coral
        options:
          - verde
          - azul
          - coral
          - violeta
          - amarelo

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      JUH_LAYOUT: ${{ inputs.layout }}

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar FFmpeg e fontes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation2 fontconfig

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      - name: Gerar videos
        run: python -u gerar_videos_caderno_juh.py

      - name: Salvar cópia no Google Drive
        if: ${{ vars.GOOGLE_DRIVE_FOLDER_ID != '' }}
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          pip install google-api-python-client google-auth
          python -u subir_videos_drive.py

      - name: Guardar videos e legendas no GitHub
        uses: actions/upload-artifact@v4
        with:
          name: JUH-QUIZ-CADERNO-${{ inputs.layout }}-${{ github.run_number }}
          path: |
            output_juh_caderno/*.mp4
            output_juh_caderno/*.txt
          if-no-files-found: error
          retention-days: 7
